[package]
name    = "wal-db"
version = "0.4.0"

rust-version = "1.85"
edition = "2024"
license = "Apache-2.0 OR MIT"
readme  = "README.md"

description = "Write-ahead log primitive for Rust storage engines. Durable, recoverable, lock-free append path. The WAL substrate under lsm-db, txn-db, raft-io, and Hive DB."

keywords = [
    "wal",
    "write-ahead-log",
    "database",
    "durability",
    "recovery"
]

categories = [
    "database-implementations",
    "filesystem",
    "concurrency"
]

homepage      = "https://github.com/jamesgober/wal-db"
repository    = "https://github.com/jamesgober/wal-db"
documentation = "https://docs.rs/wal-db"

authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "wal_db"
path = "src/lib.rs"

# `loom` is a build-time cfg (`RUSTFLAGS="--cfg loom"`), not a Cargo feature, so
# it is declared here to satisfy the `unexpected_cfgs` lint under `-D warnings`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[features]
# Default surface is minimal: a byte-record log. Typed records are opt-in.
default = []
# Typed records via `pack-io`: adds `Wal::append_typed` and `Record::decode`,
# which serialise any `pack_io::Serialize`/`Deserialize` value. Additive — the
# byte-record API is unchanged when this is off.
pack-io = ["dep:pack-io"]

[dependencies]
# Domain error type. Portfolio crates standardise on `error-forge` for
# stable error metadata (kind/retryable/status) instead of thiserror/anyhow.
# Default features are off — only the `ForgeError` trait is needed.
error-forge = { version = "1.0", default-features = false }
# Hardware-accelerated CRC32C (Castagnoli) for torn-write detection. Uses
# the SSE4.2 `crc32` instruction on x86_64 and the CRC extension on aarch64
# with a software fallback. Zero dependencies of its own; rolling this by
# hand would mean re-implementing the same intrinsics with no upside.
crc32c = "0.6"
# Optional typed-record framing, behind the `pack-io` feature. The `derive`
# feature provides the `Serialize`/`Deserialize` derives consumers use.
pack-io = { version = "1.0", features = ["derive"], optional = true }

# macOS is the one platform where the standard library's fsync is not a
# durability barrier: `File::sync_all` issues `fsync`, which flushes the
# page cache to the device but not the device's own write cache. Only
# `fcntl(F_FULLFSYNC)` does. `libc` is pulled in solely to call it, and
# solely on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
tempfile  = "3"

# `loom` is a normal (not dev) dependency under `--cfg loom` only: the library's
# own synchronization primitives switch to loom's instrumented types so the
# model checker can verify the append and commit paths. It is never pulled into
# a normal build.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[[bench]]
name    = "wal_bench"
harness = false

# The typed-records example needs the `pack-io` feature, so it is only built
# when that feature is enabled (e.g. `cargo run --example typed --features pack-io`).
[[example]]
name              = "typed"
required-features = ["pack-io"]

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
